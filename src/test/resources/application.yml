# 테스트 전용 설정임
#
# *이 파일은 src/main/resources/application.yml 을 덮어쓰는 것이 아니라 통째로 가림
#   클래스패스에서 application.yml 을 하나만 찾는데
#   Gradle 테스트에서는 build/resources/test 가 앞서기 때문임
#   따라서 main 쪽에 있던 값도 여기 필요하면 다시 적어야 함
#   main 에 있는 세 줄 중 spring.application.name 과 spring.profiles.default 를 다시 적었고
#   spring.config.import 는 아래에서 설정 서버를 끄므로 적지 않음
#
# *템플릿에 있던 jpa · flyway · kafka 값은 뺐음
#   이 서비스는 DB 와 이벤트 의존성을 걷어내 그 값을 읽는 자동 설정이 올라오지 않음
#
# *캐시(Redis) 주소도 적지 않음
#   Redis 연결은 처음 쓸 때 맺으므로 컨텍스트가 뜨는 데는 주소가 필요 없음

spring:
  application:
    # 가려진 main 쪽 값을 다시 적은 것임
    # 없으면 로그의 appName 과 유레카 등록 이름이 unknown 이 됨
    name: weather-service

  profiles:
    # 가려진 main 쪽 값을 다시 적은 것임
    # logback-spring.xml 이 이 값으로 갈림
    #   local 이면 콘솔만, local 이 아니면 Loki appender 가 붙음
    # 없으면 프로파일이 default 가 되어 테스트가 Loki 로 로그를 밀어 보내려 하고
    # 로컬에 Loki 가 없으면 ConnectException 스택트레이스가 로그를 뒤덮음
    default: local

  cloud:
    config:
      # 테스트가 설정 서버 기동 여부에 따라 갈리면 안 되므로 끔
      # main 쪽 import 에 optional 이 붙어 있어 꺼도 기동은 정상임
      enabled: false

eureka:
  client:
    # 테스트는 서비스 디스커버리에 참여하지 않음
    # 켜 두면 등록을 시도하다 실패해 로그가 뒤덮임
    enabled: false

app:
  weather:
    # 설정 서버를 끄므로 config 저장소 값이 안 내려옴 — 없으면 WeatherProperties 검증에 걸려 contextLoads 가 깨짐
    # 값은 config 저장소 weather-service.yml 과 같게 두되 키는 가짜임 (테스트는 기상청을 부르지 않음)
    kma:
      base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      service-key: test-service-key
      num-of-rows: 1000
      max-attempts: 2
      retry-backoff-ms: 300
    cache:
      ttl-hours: 7
    circuit-breaker:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-seconds-in-open-state: 30
      permitted-calls-in-half-open-state: 2
