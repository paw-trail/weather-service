# 공통 모듈 버전. 공통 모듈이 갱신되면 이 값만 바꾸고 다시 빌드합니다.
# 최신 버전은 조직 Packages 페이지에서 확인합니다.
commonVersion=0.0.14

# 라이브러리 버전
querydslVersion=7.6
springdocVersion=3.1.0

# 테스트용 컨테이너 라이브러리
# spring-boot-testcontainers 가 전이로 끌어오는 코어 버전과 맞출 것
# 어긋나면 코어와 모듈이 다른 버전으로 섞임
# 확인은 ./gradlew dependencies --configuration testCompileClasspath 로 함
testcontainersVersion=2.0.5

# 빌드 설정
org.gradle.caching=true
org.gradle.parallel=true
