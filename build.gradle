plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pawtrail'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()

    // 공통 모듈(com.pawtrail:common)은 GitHub Packages 에 배포돼 있음
    // 내려받으려면 GPR_USER, GPR_TOKEN 환경변수가 설정돼 있어야 함
    // 설정 방법은 README 의 "공통 모듈 가져오기" 절을 참고
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/paw-trail/common")
        credentials {
            username = System.getenv("GPR_USER")
            password = System.getenv("GPR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    // ── 공통 모듈 ─────────────────────────────────────────────
    // 버전은 gradle.properties 의 commonVersion 에 있음
    // 새 버전이 나오면 그 값만 바꾸고 다시 빌드하면 됨
    // 내려받기에 필요한 인증은 위 repositories 블록에 있음
    implementation "com.pawtrail:common:${commonVersion}"

    // 공통 모듈의 PageResponse 가 org.springframework.data.domain.Page 를 씀
    // starter-data-redis 가 전이로 끌어오지만 그러면 페이징이 캐시 의존성에 매달리므로
    // 직접 선언함
    // DB 를 쓰지 않는 서비스도 목록 응답을 반환하므로 이 줄은 남길 것
    implementation 'org.springframework.data:spring-data-commons'

    // ── 웹 · 검증 · 보안 · 상태확인 ────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── 데이터 · 이벤트 ───────────────────────────────────────
    // 템플릿의 데이터 블록(DB · 좌표 · 쿼리 도구)과 이벤트 한 줄을 통째로 뺐음
    //
    // * DB 가 없음
    //   예보는 기상청이 가지고 있고 이 서비스는 받아서 잠시 캐시에 둘 뿐이라 담아 둘 표가 없음
    //
    // * 이벤트를 내지도 받지도 않음
    //
    // * 함께 지운 곳
    //   아래 테스트 블록의 짝 · 테스트용 데이터베이스 블록 · 앱 클래스의 애노테이션 두 줄
    //   gradle.properties 의 두 버전 값

    // ── 캐시 ──────────────────────────────────────────────────
    // 같은 격자의 같은 발표를 다시 부르지 않으려고 Redis 에 둠
    // 새 발표를 못 받았을 때 내줄 직전 발표도 여기 남음
    // DB 없는 서비스 가운데 캐시를 쓰는 첫 사례라 verdict · extract 와 달리 이 줄을 남김
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ── Spring Cloud ──────────────────────────────────────────
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // 회로 차단기 — 기상청 호출을 감쌈
    // 스프링 클라우드 추상화(CircuitBreakerFactory)로 코드에서 감쌈 — 실패를 직전 발표로 넘기는 흐름을 한 자리에서 보이게
    // 이 스타터가 resilience4j-spring-boot3 도 함께 끌어와 애노테이션(@CircuitBreaker)도 쓸 수는 있음 (search 실행 jar 로 확인)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // ── 관측 ──────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    runtimeOnly   'io.micrometer:micrometer-registry-prometheus'

    // ── API 문서 ──────────────────────────────────────────────
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // ── Lombok ────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ────────────────────────────────────────────────
    // 템플릿의 data-jpa-test · flyway-test · kafka-test 와 테스트용 데이터베이스 블록을 뺐음
    // 캐시를 쓰는 코드는 저장소를 흉내 낸 단위 검사로 보고 실물은 컨테이너로 확인함 (search 선례)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-zipkin-test'

    testCompileOnly       'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능 jar 하나만 만듦
// 켜 두면 -plain.jar 가 함께 생기는데, 클래스만 든 4KB 짜리라 실행되지 않음
//
// * Dockerfile 이 COPY build/libs/*.jar 로 받으므로 둘이 있으면 어느 쪽이 담길지가
//   빌드 도구의 파일 정렬 순서에 달림
//   지금은 우연히 실행 가능한 쪽이 뒤에 와서 동작하나, 이름이 조금만 달라져도 뒤집힘
//   기동에 실패해야 드러나므로 이미지를 만드는 시점에는 알 수 없음
//
// * 공통 모듈은 반대로 이것을 켜고 bootJar 를 끔
//   그쪽은 실행되는 앱이 아니라 다른 프로젝트가 의존성으로 쓰는 라이브러리이기 때문임
tasks.named('jar') {
    enabled = false
}
