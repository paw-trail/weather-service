plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pawtrail'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()

    // 공통 모듈(com.pawtrail:common)은 GitHub Packages 에 배포돼 있음
    // 내려받으려면 GPR_USER, GPR_TOKEN 환경변수가 설정돼 있어야 함
    // 설정 방법은 README 의 "공통 모듈 가져오기" 절을 참고
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/paw-trail/common")
        credentials {
            username = System.getenv("GPR_USER")
            password = System.getenv("GPR_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    // ── 공통 모듈 ─────────────────────────────────────────────
    // 버전은 gradle.properties 의 commonVersion 에 있음
    // 새 버전이 나오면 그 값만 바꾸고 다시 빌드하면 됨
    // 내려받기에 필요한 인증은 위 repositories 블록에 있음
    implementation "com.pawtrail:common:${commonVersion}"

    // 공통 모듈의 PageResponse 가 org.springframework.data.domain.Page 를 씀
    // starter-data-redis 가 전이로 끌어오지만 그러면 페이징이 캐시 의존성에 매달리므로
    // 직접 선언함
    // DB 를 쓰지 않는 서비스도 목록 응답을 반환하므로 이 줄은 남길 것
    implementation 'org.springframework.data:spring-data-commons'

    // ── 웹 · 검증 · 보안 · 상태확인 ────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── 데이터 ────────────────────────────────────────────────
    // DB 를 쓰지 않는 서비스(verdict, congestion, route)는
    // 여기부터 QueryDSL 블록 끝까지를 통째로 제거할 것
    //
    // * JPA 4줄만 지우면 안 됨
    //   hibernate-spatial 과 QueryDSL 이 hibernate-core 와 jakarta.persistence-api 를
    //   클래스패스에 그대로 남겨, 쓰지 않는 의존성이 이미지에 실리고
    //   애노테이션 프로세서도 계속 돎
    //
    // * 함께 지워야 하는 곳이 둘 더 있음
    //   아래 테스트 블록의 data-jpa-test, flyway-test
    //   앱 클래스의 @EntityScan, @EnableJpaRepositories 와 그 import
    //   한쪽만 고치면 컴파일이 실패함
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly   'org.postgresql:postgresql'

    // 좌표 타입(PostGIS)을 쓰는 서비스만 필요함, search·route·place 가 해당됨
    implementation 'org.hibernate.orm:hibernate-spatial'

    // ── QueryDSL ──────────────────────────────────────────────
    // groupId 는 io.github.openfeign.querydsl 이지만 패키지명은 com.querydsl 그대로임
    // 따라서 소스에서는 com.querydsl.jpa.impl.JPAQueryFactory 를 그대로 import 하면 됨
    implementation      "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // ── 캐시 · 이벤트 ─────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // ── Spring Cloud ──────────────────────────────────────────
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // ── 관측 ──────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    runtimeOnly   'io.micrometer:micrometer-registry-prometheus'

    // ── API 문서 ──────────────────────────────────────────────
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // ── Lombok ────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ────────────────────────────────────────────────
    // DB 를 쓰지 않는 서비스는 data-jpa-test, flyway-test 도 함께 제거할 것
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-zipkin-test'

    // ── 테스트용 데이터베이스 ─────────────────────────────────
    // contextLoads 가 뜨려면 DataSource 가 필요한데 주소는 설정 서버에서 내려옴
    // 설정 서버가 떠 있는지에 따라 결과가 갈리면 안 되므로
    // 테스트가 자기 PostgreSQL 컨테이너를 직접 띄웠다가 끝나면 지움
    //
    // * infra 레포의 db 프로파일과는 무관함
    //   그쪽은 compose 가, 이쪽은 테스트 코드가 띄우며 서로 쓰지 않음
    //
    // * Docker 가 떠 있어야 함
    //   평소 개발에 compose 컨테이너를 띄워 두므로 추가 조건은 아님
    //
    // * 아티팩트 이름에 testcontainers- 접두사가 붙는 것이 2.0 부터의 규칙임
    //   1.x 는 org.testcontainers:postgresql 이었고 그 이름은 1.x 버전까지만 존재함
    //   옛 이름으로 2.x 를 요구하면 버전을 못 찾아 FAILED 로 떨어짐
    //
    // * 버전을 직접 적는 이유
    //   Boot 이 관리하는 것은 spring-boot-testcontainers 하나뿐이고
    //   testcontainers-bom 에는 접두사가 붙은 이름들이 빠져 있어 가져와도 해결되지 않음
    //   (testcontainers-java 토론 #11251)
    //   따라서 코어 버전과 어긋나지 않도록 gradle.properties 의 값으로 맞춰 둠
    //   확인은 ./gradlew dependencies --configuration testCompileClasspath 로 함
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"

    testCompileOnly       'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능 jar 하나만 만듦
// 켜 두면 -plain.jar 가 함께 생기는데, 클래스만 든 4KB 짜리라 실행되지 않음
//
// * Dockerfile 이 COPY build/libs/*.jar 로 받으므로 둘이 있으면 어느 쪽이 담길지가
//   빌드 도구의 파일 정렬 순서에 달림
//   지금은 우연히 실행 가능한 쪽이 뒤에 와서 동작하나, 이름이 조금만 달라져도 뒤집힘
//   기동에 실패해야 드러나므로 이미지를 만드는 시점에는 알 수 없음
//
// * 공통 모듈은 반대로 이것을 켜고 bootJar 를 끔
//   그쪽은 실행되는 앱이 아니라 다른 프로젝트가 의존성으로 쓰는 라이브러리이기 때문임
tasks.named('jar') {
    enabled = false
}
